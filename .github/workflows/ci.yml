name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions: {}

jobs:
  test:

    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Project
      run: |
        uv sync --frozen --group test --group doc
    - name: Test python-dispatch
      run: |
        uv run pytest --cov --cov-config=.coveragerc tests pydispatch doc README.md
    - name: Test python-dispatch-sphinx
      run: |
        uv run pytest --cov --cov-append --cov-config=sphinx-plugin/.coveragerc sphinx-plugin/tests
    - name: Build documentation
      if: ${{ matrix.python-version == '3.13' }}
      run: uv run sphinx-build -b html -W --keep-going doc/source "$RUNNER_TEMP/python-dispatch-docs"
    - name: Test minimum supported Sphinx
      if: ${{ matrix.python-version == '3.13' }}
      run: |
        uv pip install "sphinx==8.2.0"
        uv run --no-sync pytest sphinx-plugin/tests
        uv run --no-sync pytest tests/test_docs_build.py
    - name: Upload to Coveralls
      run: uv run coveralls --service=github
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        COVERALLS_FLAG_NAME: run-${{ matrix.python-version }}
        COVERALLS_PARALLEL: true

  coveralls:
    name: Indicate completion to coveralls.io
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container: python:3-slim@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928
    steps:
    - name: Install Coveralls
      run: pip3 install --upgrade coveralls
    - name: Finished
      run: coveralls --finish
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
