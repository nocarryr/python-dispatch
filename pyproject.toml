
[project]
name = "python-dispatch"
version = "0.2.41"
description = "Lightweight Event Handling Library for Python"
authors = [
    { name = "Matthew Reid", email = "matt@nomadic-recording.com" }
]
readme = "README.md"
license = "MIT"
keywords = ["event", "properties", "dispatch"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Software Development",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
[project.urls]
Documentation = "https://python-dispatch.readthedocs.io/"
Source = "https://github.com/nocarryr/python-dispatch"
Download = "https://pypi.org/project/python-dispatch/"
Tracker = "https://github.com/nocarryr/python-dispatch/issues"


[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "pydispatch"

[tool.uv.sources]
python-dispatch = { workspace = true }
python-dispatch-sphinx = { workspace = true }

[tool.uv.workspace]
members = [
    "sphinx-plugin",
]


[tool.pytest.ini_options]
testpaths = ["tests", "doc", "pydispatch"]
addopts = "--doctest-modules --doctest-glob='*.rst' --doctest-glob='*.md'"
doctest_plus = "enabled"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"


[tool.ruff.lint.per-file-ignores]
# The package intentionally re-exports its public API through star imports;
# preserve the existing version fallback and legacy compatibility warning.
"pydispatch/__init__.py" = ["E722", "F403", "UP036"]
# Sphinx expects option_spec dictionaries to be shared class attributes.
"sphinx-plugin/pydispatch_sphinx/documenters.py" = ["RUF012"]


[dependency-groups]
doc = [
    "docutils>=0.17",
    "furo>=2024.8.6",
    "myst-parser>=4.0.0",
    "sphinx>=8.2,<9",
    "sphinx-design>=0.6.1",
    "sphinxcontrib-restbuilder>=0.3",
    "sphinx-rtd-theme>=1.3.0",
]
test = [
    {include-group = "doc"},
    "coveralls>=3.3.1",
    "mypy>=2.4.1",
    "pytest>=7.0.1",
    "pytest-asyncio>=0.16.0",
    "pytest-cov>=4.0.0",
    "pytest-doctestplus>=0.9.0",
    "ruff>=0.17.4",
    "types-docutils>=0.21,<0.22",
]

dev = [
    {include-group = "test"},
    "python-dispatch-sphinx",
]
